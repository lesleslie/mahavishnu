# promtool unit test for the bodai-otel-heartbeat rules.
#
#   promtool test rules config/prometheus/tests/heartbeat_rules.test.yml
#
# The first test is the one that matters. The scrape config labels the
# TARGET with `service: akosha` -- akosha's receiver is what exposed the
# counter -- and Prometheus renames the counter's own `service` label to
# `exported_service`. So `service` is "akosha" for every producer, and
# the producer that actually went quiet is `exported_service`.
#
# An alert that read the wrong one of those would name "akosha" for
# every producer in the fleet: an alert that fires correctly and points
# at the wrong service is worse than no alert, because it looks like it
# works. The expected annotations below are what catch it -- the summary
# has to name the producer, not the target.
#
# The expected annotations are copied from the rule file verbatim, so an
# edit to the operator-facing text has to be made in both places on
# purpose. That is the point: the text IS the runbook.
rule_files:
  - ../health_aggregator_alerts.yml

evaluation_interval: 30s

tests:
  # -- P0-A: a producer stops reporting -------------------------------------
  - interval: 30s
    input_series:
      - series: 'akosha_otlp_heartbeat_p0_a_total{job="bodai-ecosystem",instance="127.0.0.1:8682",service="akosha",exported_service="session-buddy"}'
        values: '0+1x20'
      - series: 'up{job="bodai-ecosystem",instance="127.0.0.1:8682"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 2m
        alertname: OtelHeartbeatProducerSilent
        exp_alerts:
          - exp_labels:
              severity: "critical"
              component: "otel-substrate"
              bodai_repo: "akosha"
              job: "bodai-ecosystem"
              instance: "127.0.0.1:8682"
              service: "akosha"
              exported_service: "session-buddy"
            exp_annotations:
              summary: "A rostered span producer has gone silent (session-buddy)"
              description: |-
                The heartbeat watcher found no span from `session-buddy`
                inside two consecutive 60-second windows. That is the P0-A
                condition (spec §11).

                The roster is `otel.receiver.known_mcp_servers` in
                `akosha/settings/akosha.yaml`. A rostered service that stops
                reporting is either broken or has left the fleet; both need a
                human to decide which.

                The counter only moves while the producer is ABSENT, so this
                stays true for up to five minutes after it recovers. That tail
                is deliberate: it gives the operator time to see the alert
                rather than missing a blip.

                Check:
                  curl -fsS http://localhost:8682/metrics \
                    | grep 'service="session-buddy"'
              runbook_url: "https://github.com/lesleslie/mahavishnu/blob/main/docs/runbooks/OTEL_HEARTBEAT.md#scenario-1-otelheartbeatproducersilent"
  # -- P0-A: a producer that reported for hours and then stopped --------
  # The counter must be MOVING for the alert to fire. A producer that
  # reported for hours still has a large counter value, so the expression
  # uses `increase()` rather than the raw counter -- and this test is what
  # keeps that honest.
  - interval: 30s
    input_series:
      - series: 'akosha_otlp_heartbeat_p0_a_total{job="bodai-ecosystem",instance="127.0.0.1:8682",service="akosha",exported_service="mahavishnu"}'
        values: '500+0x20'
      - series: 'up{job="bodai-ecosystem",instance="127.0.0.1:8682"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 2m
        alertname: OtelHeartbeatProducerSilent
        exp_alerts:
          []
  # -- P0-A: the producer recovered -----------------------------------
  # The counter stops moving, so `increase()` falls back to zero and the
  # alert clears. This is the "it is fine now" path.
  - interval: 30s
    input_series:
      - series: 'akosha_otlp_heartbeat_p0_a_total{job="bodai-ecosystem",instance="127.0.0.1:8682",service="akosha",exported_service="oneiric"}'
        values: '0+1x4 0+0x16'
      - series: 'up{job="bodai-ecosystem",instance="127.0.0.1:8682"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 2m
        alertname: OtelHeartbeatProducerSilent
        exp_alerts:
          - exp_labels:
              severity: "critical"
              component: "otel-substrate"
              bodai_repo: "akosha"
              job: "bodai-ecosystem"
              instance: "127.0.0.1:8682"
              service: "akosha"
              exported_service: "oneiric"
            exp_annotations:
              summary: "A rostered span producer has gone silent (oneiric)"
              description: |-
                The heartbeat watcher found no span from `oneiric`
                inside two consecutive 60-second windows. That is the P0-A
                condition (spec §11).

                The roster is `otel.receiver.known_mcp_servers` in
                `akosha/settings/akosha.yaml`. A rostered service that stops
                reporting is either broken or has left the fleet; both need a
                human to decide which.

                The counter only moves while the producer is ABSENT, so this
                stays true for up to five minutes after it recovers. That tail
                is deliberate: it gives the operator time to see the alert
                rather than missing a blip.

                Check:
                  curl -fsS http://localhost:8682/metrics \
                    | grep 'service="oneiric"'
              runbook_url: "https://github.com/lesleslie/mahavishnu/blob/main/docs/runbooks/OTEL_HEARTBEAT.md#scenario-1-otelheartbeatproducersilent"
      # Not at 6m. The expression uses `increase(...[5m])`, and the
      # counter's last increment was at 2m -- so the window still contains
      # it and the alert is correctly still firing. The window only
      # clears once it is entirely after the last increment: 2m + 5m.
      - eval_time: 7m
        alertname: OtelHeartbeatProducerSilent
        exp_alerts:
          []
  # -- the substrate became unreadable ---------------------------------
  - interval: 30s
    input_series:
      - series: 'akosha_otlp_heartbeat_query_failed_total{job="bodai-ecosystem",instance="127.0.0.1:8682",service="akosha",exported_service="akosha",code="catalog"}'
        values: '0+1x20'
      - series: 'up{job="bodai-ecosystem",instance="127.0.0.1:8682"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 4m
        alertname: OtelHeartbeatQueryFailedPersistent
        exp_alerts:
          - exp_labels:
              severity: "critical"
              component: "otel-substrate"
              bodai_repo: "akosha"
              job: "bodai-ecosystem"
              instance: "127.0.0.1:8682"
              service: "akosha"
              exported_service: "akosha"
              code: "catalog"
            exp_annotations:
              summary: "The heartbeat watcher cannot read the span substrate"
              description: |-
                The watcher's query RAISED rather than returning no rows — the
                substrate is closed, locked, or corrupt. The `code` label says
                which kind: `catalog`, `connection`, `io`, `operational`,
                `runtime`, `timeout`, `not_initialized`.

                This is NOT a quiet producer. A query that ran and found
                nothing is evidence about a producer; a query that could not
                run is evidence about the substrate, and it SUPPRESSES P0-A
                while it lasts — paging on it sends the operator to the wrong
                system at 3am.

                The threshold is two heartbeat windows (120s) of continued
                failure, which is why this rule holds for 2m.

                Check:
                  curl -fsS http://localhost:8682/metrics \
                    | grep -E '^akosha_otlp_heartbeat_query_failed_total'
              runbook_url: "https://github.com/lesleslie/mahavishnu/blob/main/docs/runbooks/OTEL_HEARTBEAT.md#scenario-2-otelheartbeatqueryfailedpersistent"
  # -- the roster is empty ---------------------------------------------------
  - interval: 30s
    input_series:
      - series: 'akosha_otlp_heartbeat_empty_roster_total{job="bodai-ecosystem",instance="127.0.0.1:8682",service="akosha"}'
        values: '0+1x20'
      - series: 'up{job="bodai-ecosystem",instance="127.0.0.1:8682"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 2m
        alertname: OtelHeartbeatRosterEmpty
        exp_alerts:
          - exp_labels:
              severity: "critical"
              component: "otel-substrate"
              bodai_repo: "akosha"
              job: "bodai-ecosystem"
              instance: "127.0.0.1:8682"
              service: "akosha"
            exp_annotations:
              summary: "The heartbeat watcher's roster is empty — nothing is being watched"
              description: |-
                `otel.receiver.known_mcp_servers` in
                `akosha/settings/akosha.yaml` is empty. The watcher therefore
                has nothing to check, and "everything is fine" is the one
                answer it must not give: a registry wipe, or a substrate lift
                that dropped every entry, is indistinguishable from a healthy
                system until somebody looks.

                This fires on every cycle while the roster is empty, so the
                counter climbs while it lasts and resets when the roster is
                repopulated.

                Check:
                  grep -A 8 'known_mcp_servers' \
                    /Users/les/Projects/akosha/settings/akosha.yaml
              runbook_url: "https://github.com/lesleslie/mahavishnu/blob/main/docs/runbooks/OTEL_HEARTBEAT.md#scenario-3-otelheartbeatrosterempty"
