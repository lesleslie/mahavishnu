# Prometheus Alerting Rules for the Health Aggregator
#
# Phase 4 of
# docs/plans/2026-09-14-common-mcp-client-transport-unification.md §11.4:
# per-feed health aggregator alert rules for the Bodai MCP servers
# (akosha, session-buddy, mahavishnu, oneiric, crackerjack). The alerts
# surface operator-facing signals — HTTP 503 from /health, recent
# error rates per feed, and silent decay-disable windows.
#
# Usage:
#   Add to prometheus.yml's rule_files list alongside alerting_rules.yml:
#     rule_files:
#       - "alerting_rules.yml"
#       - "health_aggregator_alerts.yml"
#
# Runbook: docs/runbooks/HEALTH_REASON_CODES.md — every alert annotation
# includes a ``runbook_url`` so operators triage via the canonical
# ReasonCode action guidance.
#
# NOTE on metric sources and label conventions:
# - The fleet runs NO blackbox_exporter. ``probe_success`` and
#   ``probe_http_status_code`` have no source in any Prometheus config,
#   so rules that read them could never fire. The service-down signal
#   comes from Prometheus's own ``up`` series on the
#   ``bodai-ecosystem`` scrape job instead, and the service-degraded
#   signal comes from the health aggregator's own verdict series.
# - ``health_feed_status{feed, repo, status}``,
#   ``health_feed_errors_within_window{feed, repo}`` and
#   ``mcp_common_health_halflife_seconds{repo}`` are emitted by
#   mcp-common's health aggregator and ARE scraped today (verified
#   against the live Prometheus). They are the metrics these rules read.
# - Label convention: ``repo`` is the plain component name ("mahavishnu",
#   "session-buddy", "akosha", ...) — both the file_sd target label in
#   monitoring/file_sd/verified_metrics_targets.yml and the label the
#   aggregator stamps on its own series. The earlier
#   ``repo=~"bodai-mcp-.*"`` selector came from the 2026-08-20 MCP
#   surface standardization plan, where "bodai-mcp-*" names a server's
#   baseline tool identity; it never became a Prometheus label, so every
#   rule using it matched zero series. These rules deliberately carry
#   NO repo filter: the aggregator metrics exist only on Bodai
#   components, so filtering would only risk drifting out of sync with
#   the fleet's membership.

groups:
  - name: bodai-health-aggregator
    interval: 30s
    rules:

      # ------------------------------------------------------------------
      # Service-level health (always actionable)
      # ------------------------------------------------------------------
      # The fleet runs no blackbox_exporter, so there is no probe_* series
      # to read the /health HTTP status code from. Two equivalent signals
      # exist: Prometheus's own ``up`` series says whether the server is
      # scrapeable at all, and the health aggregator's verdict series says
      # what /health would answer (the /health route returns 503 exactly
      # when the aggregate verdict is degraded or failed).

      - alert: BodaiMCPServerHealthDown
        expr: |
          up{job="bodai-ecosystem"} == 0
        for: 2m
        labels:
          severity: critical
          component: health-aggregator
          bodai_repo: "{{ $labels.repo }}"
        annotations:
          summary: "{{ $labels.repo }} is not scrapeable for 2m+"
          description: |
            Prometheus cannot scrape {{ $labels.repo }}
            ({{ $labels.instance }}). The server is down, restarting, or
            its /metrics route is not answering. Check
            `mcp-ctl status {{ $labels.repo }}` and the launchd logs.
          runbook_url: "https://github.com/lesleslie/mahavishnu/blob/main/docs/runbooks/HEALTH_REASON_CODES.md"

      - alert: BodaiMCPServerHealthDegraded
        expr: |
          max by (repo) (health_feed_status{status=~"degraded|failed"}) > 0
        for: 5m
        labels:
          severity: warning
          component: health-aggregator
          bodai_repo: "{{ $labels.repo }}"
        annotations:
          summary: "{{ $labels.repo }} /health degraded for 5m+"
          description: |
            The health aggregator's worst-case verdict for
            {{ $labels.repo }} has been degraded or failed for 5+ minutes,
            which is what makes /health answer 503. Read the JSON body's
            ``checks`` map for per-feed verdicts and reason_codes.
          runbook_url: "https://github.com/lesleslie/mahavishnu/blob/main/docs/runbooks/HEALTH_REASON_CODES.md"

      # ------------------------------------------------------------------
      # /health body-level alerts (per feed)
      # ------------------------------------------------------------------
      # These read the aggregator's per-feed series, which are emitted by
      # ``aggregate_feed_states`` in mcp-common and scraped today.

      - alert: BodaiFeedRecentErrorWithinHalflife
        expr: |
          health_feed_errors_within_window > 0
        for: 5m
        labels:
          severity: warning
          component: health-aggregator
          bodai_repo: "{{ $labels.repo }}"
          feed: "{{ $labels.feed }}"
        annotations:
          summary: "Feed {{ $labels.feed }} on {{ $labels.repo }} has fresh errors"
          description: |
            Feed ``{{ $labels.feed }}`` on repo ``{{ $labels.repo }}``
            has accumulated errors within the halflife window
            (default 300s). The aggregator escalates this to DEGRADED.
            Read the producer's stderr log for the most recent traceback.
          runbook_url: "https://github.com/lesleslie/mahavishnu/blob/main/docs/runbooks/HEALTH_REASON_CODES.md#error_within_halflife"

      - alert: BodaiFeedNeverPopulated
        expr: |
          health_feed_status{status="degraded"} > 0
        for: 10m
        labels:
          severity: critical
          component: health-aggregator
          bodai_repo: "{{ $labels.repo }}"
          feed: "{{ $labels.feed }}"
        annotations:
          summary: "Feed {{ $labels.feed }} on {{ $labels.repo }} broken-before-first-success"
          description: |
            Feed ``{{ $labels.feed }}`` on repo ``{{ $labels.repo }}``
            has been reporting ``status=degraded`` with the
            ``feed_never_populated`` reason code for 10+ minutes.
            This is the HNSW hardening case — the producer is alive
            but the very first cycle raised an exception (cycles_total=0).
            Common root causes: pgvector misconfigured, embedding service
            unreachable, upstream API down.
          runbook_url: "https://github.com/lesleslie/mahavishnu/blob/main/docs/runbooks/HEALTH_REASON_CODES.md#feed_never_populated"

      - alert: BodaiFeedFailedIngesterNotRunning
        expr: |
          health_feed_status{status="failed"} > 0
        for: 5m
        labels:
          severity: critical
          component: health-aggregator
          bodai_repo: "{{ $labels.repo }}"
          feed: "{{ $labels.feed }}"
        annotations:
          summary: "Feed {{ $labels.feed }} on {{ $labels.repo }} producer dead"
          description: |
            Feed ``{{ $labels.feed }}`` on repo ``{{ $labels.repo }}``
            has been reporting ``status=failed`` with the
            ``ingester_not_running`` reason code for 5+ minutes.
            The producer task is not alive. Check the lifespan logs
            for whether the producer was intentionally skipped
            (``AKOSHA_SKIP_*=1``) or whether it died unexpectedly.
          runbook_url: "https://github.com/lesleslie/mahavishnu/blob/main/docs/runbooks/HEALTH_REASON_CODES.md#ingester_not_running"

      # ------------------------------------------------------------------
      # Decay-disable escape hatch (silent decode)
      # ------------------------------------------------------------------
      # Plan §5 task 7 / §4 Integration Contract Rollback signal:
      # ``mcp_common_health_halflife_seconds{repo} == 0`` for >5m
      # flags silent decay-disable. The CLI flag
      # ``--health-disable-decay`` is an operator escape hatch for
      # incident triage; it's not meant to stay set indefinitely.

      - alert: BodaiHealthDecayDisabled
        expr: |
          mcp_common_health_halflife_seconds == 0
        for: 5m
        labels:
          severity: warning
          component: health-aggregator
          bodai_repo: "{{ $labels.repo }}"
        annotations:
          summary: "Decay disabled on {{ $labels.repo }} for 5m+"
          description: |
            The ``--health-disable-decay`` CLI flag (or
            ``HEALTH_FEED_HALFLIFE_SECONDS=0`` env var) has been set on
            ``{{ $labels.repo }}`` for 5+ minutes. Fresh errors are NOT
            escalating feeds to DEGRADED via the halflife predicate.
            This is an operator escape hatch for incident triage — if
            the upstream issue is resolved, restart the server without
            the flag (or with ``HEALTH_FEED_HALFLIFE_SECONDS=300``).
          runbook_url: "https://github.com/lesleslie/mahavishnu/blob/main/docs/runbooks/HEALTH_REASON_CODES.md"

  # ------------------------------------------------------------------
  # Synthetic canary (§11.3, PR-A4) — the receiver that stops writing
  # ------------------------------------------------------------------

  - name: bodai-otel-canary
    interval: 30s
    rules:

      - alert: OtelReceiverCanaryStale
        expr: |
          (time() * 1e9 - akosha_otlp_canary_last_success_unix_nano > 60e9)
          and on(instance) (up{job="bodai-ecosystem", instance=~".*:8682"} == 1)
        for: 30s
        labels:
          severity: critical
          component: otel-substrate
          bodai_repo: "akosha"
        annotations:
          summary: "Akosha's OTLP receiver is not writing spans (canary stale 60s+)"
          description: |
            The synthetic canary (§11.3) has not landed a row in
            `spans_substrate` for more than 60 seconds — two missed
            30-second emits.

            This is NOT the heartbeat watcher's P0-A. The heartbeat
            watcher proves the substrate is QUERYABLE; the canary proves
            the receiver WRITES. A receiver that accepts spans over OTLP
            and then fails to insert them leaves `/health` green while
            every producer's spans silently drop. That is the failure
            this alert exists to catch.

            Thresholds: the canary writes every 30s. The expression
            fires at 60s of staleness (two missed emits) and the `for:
            30s` adds one more interval of confirmation, so a single
            slow cycle does not page. Total detection is ~90s.

            The `up{...} == 1` guard matters: if akosha is DOWN, the
            gauge is absent and the alert would not fire anyway, but
            "down" and "up but not writing" are different incidents and
            they deserve different alerts.

            Check the write path:
              curl -fsS http://localhost:8682/metrics \
                | grep -E "^akosha_otlp_canary_(writes|last_success)"
            A non-zero `akosha_otlp_canary_writes_failed_total{reason=...}`
            names the failure. See the spec §11.3 and
            `akosha/docs/ops/OTEL_TEMPO_HOOK.md`.
          runbook_url: "https://github.com/lesleslie/akosha/blob/main/docs/ops/OTEL_TEMPO_HOOK.md"

  # ---------------------------------------------------------------------------
  # bodai-otel-heartbeat — the heartbeat watcher's three P0 conditions (§11)
  #
  # The canary group above proves the receiver WRITES. This group proves the
  # producers still REPORT — the other half of the same question.
  #
  # The watcher in akosha/observability/heartbeat_watcher.py emits a counter
  # for each of its three P0 conditions:
  #
  #   akosha_otlp_heartbeat_p0_a_total{service}      a service missed two
  #                                                   consecutive 60s windows
  #   akosha_otlp_heartbeat_query_failed_total{code}  the substrate could not
  #                                                   be read at all
  #   akosha_otlp_heartbeat_empty_roster_total        the roster is empty, so
  #                                                   nothing is being watched
  #
  # All three counters were emitted and NONE of them was queried by a rule,
  # so the watcher detected the fleet's producers going silent for four hours
  # without anything paging. These rules close that loop.
  #
  # ---------------------------------------------------------------------------
  # LABEL TRAP — read this before editing an expression here.
  #
  # The scrape config attaches `service` to the TARGET, not to the producer:
  # `monitoring/file_sd/verified_metrics_targets.yml` labels the target
  # 127.0.0.1:8682 with `service: akosha`, because that target IS akosha.
  # The heartbeat counter carries its OWN `service` label (the roster entry
  # that went quiet), and Prometheus -- with the default `honor_labels:
  # false` -- renames the metric's label to `exported_service` and keeps the
  # target's `service`.
  #
  # So every one of these series carries:
  #     service="akosha"              <- the target that exposed it
  #     exported_service="session-buddy"  <- the producer that emitted it
  #
  # `{{ $labels.service }}` in an annotation here would print "akosha" for
  # EVERY producer -- an alert that names the wrong service. The producer is
  # `exported_service`. Verified against the live series.
  # ---------------------------------------------------------------------------

  - name: bodai-otel-heartbeat
    interval: 30s
    rules:

      - alert: OtelHeartbeatProducerSilent
        expr: |
          increase(akosha_otlp_heartbeat_p0_a_total[5m]) > 0
          and on(instance) (up{job="bodai-ecosystem", instance=~".*:8682"} == 1)
        for: 30s
        labels:
          severity: critical
          component: otel-substrate
          bodai_repo: "akosha"
        annotations:
          summary: "A rostered span producer has gone silent ({{ $labels.exported_service }})"
          description: |-
            The heartbeat watcher found no span from `{{ $labels.exported_service }}`
            inside two consecutive 60-second windows. That is the P0-A
            condition (spec §11).

            The roster is `otel.receiver.known_mcp_servers` in
            `akosha/settings/akosha.yaml`. A rostered service that stops
            reporting is either broken or has left the fleet; both need a
            human to decide which.

            The counter only moves while the producer is ABSENT, so this
            stays true for up to five minutes after it recovers. That tail
            is deliberate: it gives the operator time to see the alert
            rather than missing a blip.

            Check:
              curl -fsS http://localhost:8682/metrics \
                | grep 'service="{{ $labels.exported_service }}"'
          runbook_url: "https://github.com/lesleslie/mahavishnu/blob/main/docs/runbooks/OTEL_HEARTBEAT.md#scenario-1-otelheartbeatproducersilent"

      - alert: OtelHeartbeatQueryFailedPersistent
        expr: |
          increase(akosha_otlp_heartbeat_query_failed_total[5m]) > 0
          and on(instance) (up{job="bodai-ecosystem", instance=~".*:8682"} == 1)
        for: 2m
        labels:
          severity: critical
          component: otel-substrate
          bodai_repo: "akosha"
        annotations:
          summary: "The heartbeat watcher cannot read the span substrate"
          description: |-
            The watcher's query RAISED rather than returning no rows — the
            substrate is closed, locked, or corrupt. The `code` label says
            which kind: `catalog`, `connection`, `io`, `operational`,
            `runtime`, `timeout`, `not_initialized`.

            This is NOT a quiet producer. A query that ran and found
            nothing is evidence about a producer; a query that could not
            run is evidence about the substrate, and it SUPPRESSES P0-A
            while it lasts — paging on it sends the operator to the wrong
            system at 3am.

            The threshold is two heartbeat windows (120s) of continued
            failure, which is why this rule holds for 2m.

            Check:
              curl -fsS http://localhost:8682/metrics \
                | grep -E '^akosha_otlp_heartbeat_query_failed_total'
          runbook_url: "https://github.com/lesleslie/mahavishnu/blob/main/docs/runbooks/OTEL_HEARTBEAT.md#scenario-2-otelheartbeatqueryfailedpersistent"

      - alert: OtelHeartbeatRosterEmpty
        expr: |
          increase(akosha_otlp_heartbeat_empty_roster_total[5m]) > 0
          and on(instance) (up{job="bodai-ecosystem", instance=~".*:8682"} == 1)
        for: 30s
        labels:
          severity: critical
          component: otel-substrate
          bodai_repo: "akosha"
        annotations:
          summary: "The heartbeat watcher's roster is empty — nothing is being watched"
          description: |-
            `otel.receiver.known_mcp_servers` in
            `akosha/settings/akosha.yaml` is empty. The watcher therefore
            has nothing to check, and "everything is fine" is the one
            answer it must not give: a registry wipe, or a substrate lift
            that dropped every entry, is indistinguishable from a healthy
            system until somebody looks.

            This fires on every cycle while the roster is empty, so the
            counter climbs while it lasts and resets when the roster is
            repopulated.

            Check:
              grep -A 8 'known_mcp_servers' \
                /Users/les/Projects/akosha/settings/akosha.yaml
          runbook_url: "https://github.com/lesleslie/mahavishnu/blob/main/docs/runbooks/OTEL_HEARTBEAT.md#scenario-3-otelheartbeatrosterempty"
