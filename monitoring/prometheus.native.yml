# Prometheus — Bodai ecosystem (native install).
#
# This host runs the fleet as native launchd services, so the scrape
# targets are 127.0.0.1, not the host.docker.internal names the Docker
# Compose stack uses.
#
# Install it as:
#
#   cp monitoring/prometheus.native.yml /usr/local/etc/prometheus.yml
#   brew services restart prometheus
#
# The target list is GENERATED by the repo's own verifier, which probes
# each service and only promotes the ones that actually serve Prometheus
# text:
#
#   .venv/bin/python scripts/verify_ecosystem_metrics.py \
#       --scrape-host 127.0.0.1 \
#       --write-verified-file monitoring/file_sd/verified_metrics_targets.yml
#
# A service that is down, or that has no /metrics route, is simply absent
# from the file — it is not scraped, and it does not become a firing
# alert. Note the ``--scrape-host`` flag: without it the verifier emits
# the Docker-internal hostnames, which a natively-installed Prometheus
# cannot resolve.
#
# The rule files live in this repo so they are versioned with the metrics
# they query. All four are validated by ``promtool check rules``; a
# template error in any one of them stops Prometheus loading the whole
# configuration, so keep them clean.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'bodai-local'
    environment: 'production'

rule_files:
  - /Users/les/Projects/mahavishnu/config/prometheus/alerting_rules.yml
  - /Users/les/Projects/mahavishnu/config/prometheus/bifrost_alerts.yml
  - /Users/les/Projects/mahavishnu/config/prometheus/error_budget_rules.yml
  - /Users/les/Projects/mahavishnu/config/prometheus/health_aggregator_alerts.yml

scrape_configs:
  - job_name: "prometheus"
    static_configs:
    - targets: ["localhost:9090"]

  - job_name: "bodai-ecosystem"
    file_sd_configs:
      - files:
          - /Users/les/Projects/mahavishnu/monitoring/file_sd/verified_metrics_targets.yml
        refresh_interval: 1m
