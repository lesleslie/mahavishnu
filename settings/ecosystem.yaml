coordination:
  issues:
  - id: MHV-001
    title: asyncio.run() called in sync context
    description: 'app.py:707 calls asyncio.run() inside _check_user_repo_permission

      which will fail at runtime when called from async code.

      This creates a nested event loop scenario that Python does not support.

      '
    severity: critical
    priority: P0
    status: fixed
    resolution: Added ThreadPoolExecutor fallback for async context detection
    pool: python
    affected_files:
    - mahavishnu/core/app.py
    created_at: 2026-02-20 12:00:00+00:00
    fixed_at: 2026-02-20 16:30:00+00:00
    labels:
    - async
    - bug
    - runtime-error
  - id: MHV-002
    title: Missing logger import in unified_orchestrator.py
    description: 'Lines 223-225 reference `logger` but it is never imported.

      Will crash when cancel_workflow hits an exception.

      Need to add: import logging; logger = logging.getLogger(__name__)

      '
    severity: critical
    priority: P0
    status: fixed
    resolution: Added structlog import and logger initialization
    pool: python
    affected_files:
    - mahavishnu/core/unified_orchestrator.py
    created_at: 2026-02-20 12:00:00+00:00
    fixed_at: 2026-02-20 16:30:00+00:00
    labels:
    - bug
    - import-error
  - id: MHV-003
    title: No shutdown events in background loops
    description: 'Four background loops lack shutdown events, preventing graceful stops:

      - resilience.py:705 - _circuit_breaker_loop

      - monitoring.py:200 - _metrics_loop

      - memory_aggregator.py:165 - _sync_loop

      - terminal/pool.py:201 - _pool_loop

      Each needs asyncio.Event for clean shutdown.

      '
    severity: critical
    priority: P0
    status: fixed
    resolution: Added asyncio.Event shutdown handling to all 4 background loops
    pool: python
    affected_files:
    - mahavishnu/core/resilience.py
    - mahavishnu/core/monitoring.py
    - mahavishnu/pools/memory_aggregator.py
    - mahavishnu/terminal/pool.py
    created_at: 2026-02-20 12:00:00+00:00
    fixed_at: 2026-02-20 16:30:00+00:00
    labels:
    - async
    - shutdown
    - graceful-stop
  - id: MHV-004
    title: N+1 HTTP pattern in batch insert
    description: 'memory_aggregator.py:118-147 makes sequential HTTP requests for each

      memory item in batch_insert_memories. Should use asyncio.gather()

      for parallel requests or implement a batch endpoint.

      '
    severity: high
    priority: P1
    status: fixed
    resolution: Implemented parallel batch inserts with asyncio.gather
    pool: perf
    affected_files:
    - mahavishnu/pools/memory_aggregator.py
    created_at: 2026-02-20 12:00:00+00:00
    fixed_at: 2026-02-20 16:45:00+00:00
    labels:
    - performance
    - http
    - batch
  - id: MHV-005
    title: SSRF vulnerability in content ingestion
    description: 'content_ingester.py accepts arbitrary URLs without validation.

      No blocklist for:

      - Internal IP ranges (10.x, 172.16-31.x, 192.168.x)

      - Cloud metadata endpoints (169.254.169.254)

      - file:// protocol

      Needs URL validation and allowlist/blocklist.

      '
    severity: high
    priority: P1
    status: fixed
    resolution: Added URL validation with IP blocklist and scheme checking
    pool: security
    affected_files:
    - mahavishnu/ingesters/content_ingester.py
    created_at: 2026-02-20 12:00:00+00:00
    fixed_at: 2026-02-20 16:45:00+00:00
    labels:
    - security
    - ssrf
    - input-validation
  - id: MHV-006
    title: Heap synchronization missing in pool manager
    description: 'pools/manager.py:185-232 modifies heap and dict without synchronization.

      The _priority_heap and _pool_metrics are accessed concurrently without

      locks, which could cause race conditions under high concurrency.

      Needs threading.Lock or asyncio.Lock protection.

      '
    severity: high
    priority: P1
    status: fixed
    resolution: Added asyncio.Lock for thread-safe heap and dict access
    pool: python
    affected_files:
    - mahavishnu/pools/manager.py
    created_at: 2026-02-20 12:00:00+00:00
    fixed_at: 2026-02-20 16:45:00+00:00
    labels:
    - concurrency
    - race-condition
  - id: MHV-007
    title: datetime.utcnow() deprecation
    description: 'Python 3.12+ deprecates datetime.utcnow() in favor of datetime.now(UTC).

      Six files use the deprecated pattern.

      Should migrate to: datetime.now(timezone.utc) or datetime.now(UTC)

      '
    severity: medium
    priority: P2
    status: fixed
    resolution: Updated all occurrences to datetime.now(UTC)
    pool: python
    affected_files:
    - mahavishnu/core/dependency_graph.py
    - mahavishnu/core/task_ordering.py
    - mahavishnu/core/pattern_detection.py
    - mahavishnu/core/predictions.py
    - mahavishnu/models/pattern.py
    - mahavishnu/core/blocker_detection.py
    created_at: 2026-02-20 12:00:00+00:00
    fixed_at: 2026-02-20 17:00:00+00:00
    labels:
    - deprecation
    - python-3.12
  - id: MHV-008
    title: Status enum proliferation
    description: '20+ status enums with overlapping values (PENDING, IN_PROGRESS, etc)

      across multiple files. This creates maintenance burden and potential

      for inconsistent state handling.

      Should consolidate to ~4 base enums:

      - TaskStatus

      - WorkflowStatus

      - PoolStatus

      - WorkerStatus

      '
    severity: medium
    priority: P2
    status: fixed
    resolution: Consolidated 18 status enums into unified module at mahavishnu/core/status.py
    pool: python
    affected_files:
    - mahavishnu/core/task_store.py
    - mahavishnu/core/dependency_graph.py
    - mahavishnu/core/progress_tracker.py
    - mahavishnu/core/coordination/models.py
    created_at: 2026-02-20 12:00:00+00:00
    fixed_at: 2026-02-20 19:30:00+00:00
    labels:
    - refactoring
    - deduplication
