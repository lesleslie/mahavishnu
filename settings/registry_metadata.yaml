# Bodai registry metadata overlay
#
# This file is the registry-only annotation layer over settings/ecosystem.yaml.
# It carries data the registry presents but other consumers of ecosystem.yaml
# don't need (Phase ordering, FastMCP version stamps, provenance split,
# exclusion reasons, archive pointers).
#
# Authoritative source of repo catalog: settings/ecosystem.yaml
# Generated by: scripts/regen_bodai_registry.py
# Regenerate when: any entry changes in either file.
#
# Schema (per repo key, all optional unless noted):
#   phase:                Streaming-tar rollout phase (e.g. "Phase 0.1")
#   provenance:           "brief" (was in original Phase 0.0 brief) or "discovered"
#   fastmcp_pin:          FastMCP version pin (e.g. ">=4.0.3 (<5)")
#   fastmcp_pin_as_of:    ISO date the pin was last verified
#   requires_python_pin:  Pin override (default: read from each repo's pyproject.toml)
#   registry_notes:       Free-form notes that appear in the Notes column
#   exclusion_reason:     Why the repo is in the Excluded section (not in ecosystem.yaml)
#   archive_path:         For archived repos: path under ~/Projects/ARCHIVED/
#
# DO NOT add repos here that aren't in ecosystem.yaml. Use ecosystem.yaml for that.
# DO NOT duplicate fields that already exist in ecosystem.yaml (role, status, tags, ...).

version: '1.0'
schema: bodai-registry-overlay-v1
last_updated: '2026-09-09'
sources:
  ecosystem_yaml: settings/ecosystem.yaml
  registry_doc:   BODAI_REPO_REGISTRY.md

