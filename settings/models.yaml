# Mahavishnu - LLM Model Configuration
# Updated: 2026-11-05 (task_routing is now the live source of routing)
#
# `task_routing` under each provider IS the routing the cloud worker uses.
# Edit it here and the routing resolves to the model you named -- no code
# change, no redeploy. (A cloud worker snapshots the routing into its
# provider chain when it starts, so a worker that is already running keeps
# the pre-edit routing until it restarts.) The in-code tables in
# `mahavishnu/core/model_routing.py` (DEFAULT_MINIMAX_ROUTING and friends)
# are the built-in fallback: they serve a deployment that does not ship
# this file, and they fill in any category this file omits. See
# `docs/plans/2026-11-05-yaml-backed-model-routing.md`.
#
# Provider chain:
#   1. minimax  - MiniMax M3 (primary cloud, API key required)
#   2. llama_server - llama.cpp server with qwen3.5 (local, no auth)
#
# Related files:
#   - mahavishnu/core/model_routing.py - routing tables and the loader
#   - mahavishnu/engines/agno_adapter_impl.py - Agno LLMProviderFactory
#   - config/bifrost/config.template.json - Bifrost gateway config

# =============================================================================
# CLOUD PROVIDERS
# =============================================================================

# MiniMax - Primary cloud provider (API key required)
# Updated: 2026-10-29 - M2.7 retired from the fallback chain. MiniMax closes
# M2.7/M2.5 to new users on 2026-10-19 and retires them on 2026-11-18, so the
# cloud chain is now M3 / M3.1-Flash only. llama_server is the last resort.
minimax:
  enabled: true
  require_auth: true
  api_key_env: "MINIMAX_API_KEY"
  base_url: "https://api.minimax.io/v1"
  api_key: "${MINIMAX_API_KEY}"
  priority: 1
  timeout: 30
  max_retries: 2
  task_routing:
    CODE_GENERATION: "MiniMax-M3"
    CODE_REVIEW: "MiniMax-M3"
    DEBUGGING: "MiniMax-M3"
    REFACTORING: "MiniMax-M3"
    TESTING: "MiniMax-M3"
    REASONING: "MiniMax-M3"
    ANALYSIS: "MiniMax-M3"
    DOCUMENTATION: "MiniMax-M3"
    # Latency-sensitive bucket routes to MiniMax-M3.1-Flash (added 2026-10-19;
    # fast preview model with 1M context + multimodal input; verified on the
    # MiniMax API). The other 10 categories stay on the stable MiniMax-M3.
    SWARM: "MiniMax-M3.1-Flash"
    QUICK: "MiniMax-M3.1-Flash"
    AGENT_LOOP: "MiniMax-M3.1-Flash"
    CREATIVE: "MiniMax-M3.1-Flash"
    GENERAL: "MiniMax-M3.1-Flash"
    VISION: "MiniMax-M3"
    ML_INFERENCE: "MiniMax-M3"
    EMBEDDING: "MiniMax-M3"
    # Fallback mappings. These are operator-facing meta-keys, not
    # TaskCategory members -- the built-in DEFAULT_MINIMAX_ROUTING does not
    # carry them, and the loader ignores any key that names no category.
    #   FALLBACK          -> the stable model
    #   FALLBACK_HIGHSPEED -> the fast model
    # The last resort is the local llama_server provider; see fallback_chain
    # at the bottom of this file.
    FALLBACK: "MiniMax-M3"
    FALLBACK_HIGHSPEED: "MiniMax-M3.1-Flash"

# =============================================================================
# LOCAL PROVIDERS (no auth required, always available when running)
# =============================================================================

# llama-server (llama.cpp) - Secondary local provider with qwen3.5
llama_server:
  enabled: true
  require_auth: false
  base_url: "http://localhost:8081"
  priority: 2
  timeout: 60
  max_retries: 2
  task_routing:
    CODE_GENERATION: "qwen3.5"
    CODE_REVIEW: "qwen3.5"
    DEBUGGING: "qwen3.5"
    REFACTORING: "qwen3.5"
    TESTING: "qwen3.5"
    REASONING: "qwen3.5"
    GENERAL: "qwen3.5"
    ANALYSIS: "qwen3.5"
    DOCUMENTATION: "qwen3.5"
    SWARM: "qwen3.5"
    QUICK: "qwen3.5"
    ML_INFERENCE: "qwen3.5"
    AGENT_LOOP: "qwen3.5"
    CREATIVE: "qwen3.5"
    EMBEDDING: "qwen3.5"
    VISION: "qwen3.5"

# =============================================================================
# CLOUD PUBLIC-ENDPOINT PROVIDERS (RunPod Public Endpoints REST substrate)
# =============================================================================

# RunPod Public Endpoints - Tertiary cloud provider for third-party
# managed endpoints (``moonshot-kimi``, ``granite-4-0-h-small``, etc.).
# The endpoint id is supplied at runtime via ``RUNPOD_PUBLIC_ENDPOINT_ID``
# (or ``CloudWorkerConfig.runpod_public_endpoint_id``); the base_url is
# composed from the global RunPod API root and the endpoint id, so the
# operator never edits base_url here. Enabled by default; the operator
# opts in by setting the endpoint id env var. Routing uses the
# ``endpoint-default`` sentinel — the endpoint hosts a single model,
# so per-category routing on the local side is a no-op.
# The built-in ``DEFAULT_RUNPOD_PUBLIC_ROUTING`` in
# ``mahavishnu/core/model_routing.py`` is the fallback for deployments
# that do not ship this file.
runpod_public:
  enabled: true
  require_auth: true
  api_key_env: "RUNPOD_API_KEY"
  endpoint_id_env: "RUNPOD_PUBLIC_ENDPOINT_ID"
  base_url_template: "https://api.runpod.ai/v2/{endpoint_id}/v1"
  api_key: "${RUNPOD_API_KEY}"
  priority: 3
  timeout: 60
  max_retries: 2
  task_routing:
    CODE_GENERATION: "endpoint-default"
    CODE_REVIEW: "endpoint-default"
    DEBUGGING: "endpoint-default"
    REFACTORING: "endpoint-default"
    TESTING: "endpoint-default"
    REASONING: "endpoint-default"
    ANALYSIS: "endpoint-default"
    DOCUMENTATION: "endpoint-default"
    SWARM: "endpoint-default"
    QUICK: "endpoint-default"
    ML_INFERENCE: "endpoint-default"
    AGENT_LOOP: "endpoint-default"
    CREATIVE: "endpoint-default"
    GENERAL: "endpoint-default"
    VISION: "endpoint-default"
    EMBEDDING: "endpoint-default"

# =============================================================================
# DEFAULTS
# =============================================================================

default_provider: "minimax"
fallback_chain: ["minimax", "llama_server"]
