# Crackerjack settings for Mahavishnu
#
# Oneiric resolves this file as "<project_root>/settings/{project_name}.yaml"
# for project_name="crackerjack" (see crackerjack/config/loader.py:
# load_settings_for_project). Values here are overridden by
# settings/local.yaml and then by CRACKERJACK_* env vars.

# Documentation tooling.
#
# Crackerjack's `plan_index_sync` phase carries a stale fork of the plan
# index renderer: it walks a hardcoded 5-store list instead of
# auto-discovering stores, so it drops the 77 rows that live in
# docs/decisions/ and docs/audits/ and re-renders the index in a plainer
# format. scripts/regenerate_plan_index.py is the authoritative renderer
# here (scripts/audit_plan_index.py delegates store discovery to it), so
# the phase is disabled to stop it clobbering the committed index.
#
# Regenerate with: python scripts/regenerate_plan_index.py
# Verify with:     python scripts/audit_plan_index.py
#
# Interim guard until the tool defers to the repo's own script. Tracked in
# crackerjack docs/plans/2026-10-29-plan-index-sync-delegate-to-repo-script.md
#
# `auto_cleanup_on_publish` is back to its default (true). It was disabled
# here on 2026-11-15 as an interim guard, because the `documentation_cleanup`
# phase classified files by FILENAME REGEX with no frontmatter gate — so a
# publish swept `status: complete` plans out of docs/plans/ and into
# docs/plans/.archive/, which is gitignored: the plan was untracked and left
# the repo. That is what
# docs/decisions/2026-10-18-archive-completed-plans.md rule 2 forbids —
# "Plans being archived must have `status: shipped` first. Mechanical
# 'complete -> archive' is not allowed." It cost this repo the OTel
# substrate plans on 2026-10-21, 2026-10-27, 2026-10-28 (8f149717),
# 2026-11-08 and 2026-11-13.
#
# The permanent fix now lives in crackerjack: the cleanup gates on the
# document's declared lifecycle, at a single choke point, so a governed
# document is archived only when its `status:` is `shipped`. See crackerjack
# docs/plans/2026-11-15-archive-lifecycle-gate.md and
# docs/decisions/2026-11-15-archive-lifecycle-gate.md.
#
# With the gate in place, publish-time cleanup is safe again, and with it
# the frontmatter validation that runs inside that phase. Measured against
# this repo's tree through the real cleanup entry point
# (`DocumentationCleanup._detect_archivable_files()`) on crackerjack 0.95.0:
# the categorizer still finds 2 candidates — the two OTel substrate plans,
# whose filenames still match the `implementation_reports` pattern — and the
# gate holds BOTH, because each declares `status: complete`, not `shipped`.
# So 0 files are archived. The candidates being non-empty is the point:
# the gate, not the filename patterns, is what protects them.
documentation:
  auto_plan_index_sync_on_publish: false
