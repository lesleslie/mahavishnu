name: audit-requirements-weekly

# D2 traceable specs: weekly advisory run of audit_requirements.py.
# First 30 days: continue-on-error (advisory). After the convention stabilizes
# (per docs/plans/2026-09-07-traceable-specs.md promotion criteria), remove
# continue-on-error to make this a hard PR-blocking gate.

on:
  schedule:
    # Mondays at 09:00 UTC — after the weekend, before the workweek.
    - cron: "0 9 * * 1"
  workflow_dispatch:  # Allow ad-hoc runs from the GitHub UI.

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync dependencies
        run: uv sync --frozen --all-extras

      - name: Run audit_requirements.py
        continue-on-error: true  # Advisory for the first 30 days.
        run: |
          python scripts/audit_requirements.py --json | tee audit-report.json
          python scripts/audit_requirements.py --out .audit-requirements.md

      - name: Run integration test
        continue-on-error: true
        run: |
          pytest tests/integration/test_audit_requirements.py -v -m integration

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-requirements-report
          path: |
            audit-report.json
            .audit-requirements.md
          if-no-files-found: ignore
