name: Mahavishnu CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pgvector-otel:
    name: OTel pgvector (${{ matrix.postgres-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres-version: ['16', '17', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_USER: mahavishnu
          POSTGRES_PASSWORD: mahavishnu
          POSTGRES_DB: mahavishnu_otel
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: Install pgvector + Python deps
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-server-dev-${{ matrix.postgres-version }} gcc
          git clone --depth 1 --branch v0.7.4 https://github.com/pgvector/pgvector.git /tmp/pgvector
          cd /tmp/pgvector && make && sudo make install
          cd ${{ github.workspace }}
          uv sync --all-extras --group storage-pg

      - name: Create vector extension
        env:
          PGPASSWORD: mahavishnu
        run: |
          psql -h localhost -U mahavishnu -d mahavishnu_otel -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run OTel ingester unit tests (pgvector DSN in env)
        # The unit tests exercise the pgvector code paths via mocked adapters;
        # we just need the DSN present so any production-imports don't trip on
        # missing config validation. NO storage_type override — that would
        # mask the duckdb branch under test.
        env:
          MAHAVISHNU__OTEL_INGESTER__STORAGE__PG_URL: postgresql://mahavishnu:mahavishnu@localhost:5432/mahavishnu_otel
        run: |
          uv run pytest tests/unit/test_ingesters_otel_ingester.py tests/unit/test_otel_ingester_coverage.py -v --no-cov -m "not slow" --deselect 'tests/unit/test_ingesters_otel_ingester.py::TestInitializeDuckDB::test_initialize_creates_hot_store_when_none'