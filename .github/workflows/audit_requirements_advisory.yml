name: audit-requirements-weekly

# Weekly advisory run for the traceable-specs REQ-NNN audit.
#
# Per crackerjack-compliant-code "Traceable Spec IDs (REQ-NNN) — D2 wire-up
# discipline": the audit script `python scripts/audit_requirements.py --json`
# scans for orphan REQ markers (claimed but unwired) and phantom markers
# (referenced but never claimed).
#
# This workflow runs weekly and posts an advisory comment on PRs that touch
# plan files or specs. It does NOT block merges — only the gate workflow
# (audit_requirements_gate.yml) enforces a hard check.

on:
  schedule:
    # Mondays at 06:00 UTC (off-peak)
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    name: audit-requirements
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run REQ-NNN audit
        id: audit
        run: |
          python scripts/audit_requirements.py --json > audit-report.json || true
          echo "audit_exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit-report.json
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "## REQ-NNN audit" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Exit code: ${{ steps.audit.outputs.audit_exit_code }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Report: \`audit-report.json\` artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "- Policy: weekly advisory (no merge block)" >> "$GITHUB_STEP_SUMMARY"
